# Used only when running `alembic` directly during development; the application runs
# migrations through `catalog db upgrade` (see src/catalog/migrate.py).
[alembic]
script_location = %(here)s/src/catalog/migrations
prepend_sys_path = src

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
