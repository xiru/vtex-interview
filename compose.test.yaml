# Throwaway PostgreSQL for the test suite (started and stopped by scripts/test.sh).
# Data lives on tmpfs and durability is switched off: fast, and gone when stopped.
name: catalog-test

services:
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      POSTGRES_DB: catalog
      POSTGRES_INITDB_ARGS: "--locale-provider=builtin --builtin-locale=C.UTF-8"
      CATALOG_OWNER_PASSWORD: test
      CATALOG_READER_PASSWORD: test
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off",
              "-c", "full_page_writes=off"]
    tmpfs:
      - /var/lib/postgresql
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-55432}:5432"
    volumes:
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP check: the temporary server used while init scripts run only listens on a socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d catalog"]
      interval: 1s
      timeout: 3s
      retries: 30
